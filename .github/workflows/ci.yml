name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: "2"
      MITATE_CACHE: ${{ runner.temp }}/mitate-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.6"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --group dev
      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Types
        run: uv run mypy mitate serve bench
      - name: Leakage guards
        run: uv run pytest -q -m leakage
      - name: Tests and benchmark smoke run
        # tests/test_runner.py runs both benchmark stages end to end on a synthetic marketplace,
        # including the runner-level "future is invisible" perturbation test
        run: uv run pytest -q -m "not slow"
      - name: Widget and dashboard parse
        run: |
          node --check widget/mitate.js
          node --check dashboard/app.js
          node --check serve/demo_site/demo.js
